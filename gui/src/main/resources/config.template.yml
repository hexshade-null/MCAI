# MCAI Bridge 配置模板。复制为 config.yml 后修改；${VAR} 会被环境变量替换。
bot:
  name: "BridgeBot"          # 机器人玩家名（仅 ASCII 字母/数字/下划线）
  auth: "offline"            # offline | microsoft
  microsoft_client_id: ""    # 微软登录自定义 client_id（留空用库默认）

server:
  host: "localhost"
  port: 25565

ai:
  provider: "zai"
  base_url: "https://api.z.ai/api/paas/v4/chat/completions"   # Z.ai OpenAI 兼容端点
  model: "glm-5.3-flash"
  api_key: "${ZAI_API_KEY}"  # 未设置则进入 mock 模式（不调用真实 API）
  system_prompt: "你是Minecraft服务器里的AI玩家，用中文简短回答（一两句话），语气友好自然。"
  reply_prefix: "[%s] "      # %s 替换为机器人名字
  timeout_seconds: 30

connection:
  reconnect_max_attempts: 5

skin:                        # 皮肤上传（配合 paper 伴生插件）
  file: ""                   # 64x64 或 64x32 PNG 路径；空=不上传
  model: "classic"           # classic | slim
  upload_url: "http://localhost:8788/mcai/skin"
  token: "changeme"

voice:                       # 语音（配合 paper 伴生插件 SVC 中继）
  enabled: false
  server_port: 8787          # bridge 监听端口，插件会 POST 语音到这里
  token: "changeme"
  asr:
    provider: "mock"         # mock | whisper-http
    base_url: "https://api.groq.com/openai/v1"
    model: "whisper-large-v3"
    api_key: "${ASR_API_KEY}"
  tts:
    provider: "edge"         # edge | off
    voice: "zh-CN-XiaoxiaoNeural"
    fallback_text: true      # TTS 失败时回退文字回复

probe:                       # --probe 自检模式参数
  name: "TestPlayer"
  timeout_ms: 25000
